service_name: sigbot

server:
  host: 0.0.0.0
  port: 9999
  context_path: "/"

mgmt:
  enabled: true
  host: 0.0.0.0
  port: 9991
  tokio_console:
    enabled: true
    server_bind: "0.0.0.0:6669"
    retention: 60
  pyroscope:
    # Because of known-issues: https://github.com/grafana/pyroscope-rs/issues/174
    # https://github.com/tikv/pprof-rs/issues/232 Therefore it is not enabled by default for now.
    enabled: false
    server_url: "http://localhost:4040"
    tags: []
    sample_rate: 0.1
  # Notice: More OTEL custom configuration use to env: OTEL_SPAN_xxx, see: opentelemetry_sdk::trace::config::default()
  otel:
    enabled: true
    endpoint: "http://localhost:4317"
    protocol: grpc # Optional: http/protobuf,http/json,grpc
    timeout: 10000

logging:
  mode: JSON # Options: HUMAN|JSON
  level: DEBUG

swagger:
  enabled: true
  # title: "My Webnote API Server"
  # description: "The My Webnote API Server"
  # version: "1.0.0"
  # license_name: "Apache 2.0"
  # license_url: "https://www.apache.org/licenses/LICENSE-2.0"
  # contact_name: "SigBot API"
  # contact_email: "jameswong1376@gmail.com"
  # contact_url: "https://github.com/wl4g/my-webnote"
  # terms_of_service: "api/terms-of-service"
  ui_path: "/swagger-ui"
  openapi_url: "/swagger-ui/openapi.json"

# Authguard owns users, login, sessions and authorization. The HMAC key is a Secret.
authguard:
  provider: signed_header
  service: sigbot
  partition: default
  region: global
  read_action: sigbot:read
  write_action: sigbot:write

cache:
  provider: Memory # Memory|Redis
  memory:
    initial_capacity: 32
    max_capacity: 65535
    ttl: 3600000
    eviction_policy: LRU
  redis:
    nodes: ["redis://127.0.0.1:6379"]
    username: "default" # eg: "default"
    password: "${SIGBOT__CACHE__REDIS__PASSWORD:}"
    connection_timeout: 3000
    response_timeout: 6000
    retries: 1
    max_retry_wait: 65536
    min_retry_wait: 1280
    read_from_replicas: true

appdb:
  type: "SQLITE" # Options: SQLITE|POSTGRESQL|MONGODB
  sqlite:
    dir: "/tmp/sigbot/appdb/sqlite"
  postgres: # App DB for PostgreSQL
    host: "127.0.0.1"
    port: 5432
    database: "postgres"
    schema: "public"
    username: postgres
    password: "${SIGBOT__APPDB__POSTGRES__PASSWORD:}"
    min_connections: 1
    max_connections: 10
    use_ssl: false
  mongodb:
    url: mongodb://127.0.0.1:27017/sigbot
    database: sigbot

# see:https://platform.openai.com/docs/guides/completions
# see:https://github.com/ollama/ollama/blob/main/docs/api.md#generate-a-completion
# see:https://help.aliyun.com/zh/model-studio/getting-started/what-is-model-studio#16693d2e3fmir
llm:
  vecdb:
    type: "PGVECTOR" # Options: PGVECTOR
    pg_vector: # Vector DB for PostgreSQL
      host: "127.0.0.1"
      port: 5432
      database: "postgres"
      schema: "public"
      username: "postgres"
      password: "${SIGBOT__LLM__VECDB__PG_VECTOR__PASSWORD:}"
      min_connections: 1
      max_connections: 10
      use_ssl: false
  embedding:
    api_uri: "http://localhost:11434/api/embed"
    #api-key: "<YOUR EMBEDDING API KEY>" # refer to:./.env
    model: "bge-m3:latest"
    org_id: # Optional
    project_id: # Optional
    pre_delete_collection: false
    vector_dimensions: 1536
  generate:
    # Notice: The '__' should be used to distinguish different levels of structure properties, such as:
    # SIGBOT__LLM__API_KEY to match SigBotProperties{llm:LlmProperties{completion:GenerateProperties{api_key}}}
    api_uri: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    #api-key: "<YOUR GENERATE API KEY>" # refer to:./.env
    org_id: # Optional
    project_id: # Optional
    model: "qwen-plus"
    max_tokens: 65535
    temperature: 0.1
    candidate_count: 3
    top_k: 1
    top_p: 0.9
    system_prompt: |-
      You are a security expert.
      You are given a list of rules and a request.
      You must determine if the request is safe or not.
      If the request is safe, you must return "safe".
      If the request is not safe, you must return "unsafe" and provide a reason.
      You must also provide a list of rules that were used to determine the result.
      You must also providea list of rules that were not used to determine the result.

services:
  # Deploy configuration for tenant-level component deployment.
  deployer:
    # e.g: export SIGBOT__SERVICES__DEPLOYER__CRON="0 * * * * *"
    cron: "0 * * * * *"
    channel_size: 200
    images:
      postgresql: "postgres:16"
      emqx: "emqx/emqx:latest"
      timescaledb: "timescale/timescaledb:latest-pg16"
      redis: "redis:7-alpine"
      sigbot: "sigbot:latest"
    network:
      tenant_network_prefix: "sigbot-t"
    middleware:
      postgresql:
        mode: "standalone" # Options: standalone|cluster
        replicas: 1
      emqx:
        mode: "standalone" # Options: standalone|cluster
        replicas: 1
      redis:
        mode: "standalone" # Options: standalone|cluster
        replicas: 1
      timescaledb:
        mode: "standalone" # Options: standalone|cluster
        replicas: 1
  # The tenant exchange component hyperparameters and default configuration.
  exchanges:
    binance:
      # Spot
      spot_api_mainnet_endpoint: https://api.binance.com/api/v3 # https://api-gcp.binance.com,https://api2.binance.com,https://api3.binance.com,https://api4.binance.com
      spot_api_testnet_endpoint: wss://stream.testnet.binance.vision/ws
      spot_ws_mainnet_endpoint: wss://ws-api.binance.com:443/ws-api/v3
      spot_ws_testnet_endpoint: wss://ws-api.testnet.binance.vision/ws-api/v3
      # Spot-market
      spot_market_api_mainnet_endpoint: https://api.binance.com/api/v3
      spot_market_ws_mainnet_endpoint: wss://stream.binance.com:443
      # USDS-derivatives
      usds_api_mainnet_endpoint: https://fapi.binance.com/fapi/v1
      usds_api_testnet_endpoint: https://demo-fapi.binance.com
      usds_ws_mainnet_endpoint: wss://ws-fapi.binance.com/ws-fapi/v1
      usds_ws_testnet_endpoint: wss://fstream.binancefuture.com
      # USDS-derivatives-market
      usds_market_api_mainnet_endpoint: https://fapi.binance.com
      usds_market_ws_mainnet_endpoint: wss://fstream.binance.com
      # Coin-derivatives
      coin_api_mainnet_endpoint: https://dapi.binance.com/dapi/v1
      coin_api_testnet_endpoint: https://testnet.binancefuture.com
      coin_ws_mainnet_endpoint: wss://ws-dapi.binance.com/ws-dapi/v1
      coin_ws_testnet_endpoint: wss://dstream.binancefuture.com
      # Coin-derivatives-market
      coin_market_api_mainnet_endpoint: https://dapi.binance.com/dapi/v1
      coin_market_ws_mainnet_endpoint: wss://ws-dapi.binance.com/ws-dapi/v1
  # The tenant evaluator component hyperparameters and default configuration.
  # Evaluator runner handles ANALYSIS stage nodes with MAS (Multi-Agent System) provider
  # for LLM-based dynamic market analysis and hyperparameter calculation
  evaluator:
    # Cron expression for time-driven evaluation scanning (every 30 seconds)
    # Controls how frequently the evaluator scans TimescaleDB for latest market data
    cron: "0/30 * * * * *"
    # Channel size for the cron scheduler (internal queue size for scheduled jobs)
    channel_size: 5
    # Data fetch window for time-driven scans (in hours)
    # Controls how much historical data to fetch from TimescaleDB
    data_window_hours: 4
    # Execution timeout for multi-agent orchestrator (in seconds)
    # Prevents long-running evaluations from blocking the system
    execution_timeout_secs: 300
  # The tenant backtest component hyperparameters and default configuration.
  backtest:
    name: "defaultVerifier"
    enabled: true
    cron: "0 * * * * *"
    channel_size: 200
