service-name: sigbot

server:
  host: 0.0.0.0
  port: 9999
  context-path: "/"

mgmt:
  enabled: true
  host: 0.0.0.0
  port: 9991
  tokio-console:
    enabled: true
    server-bind: "0.0.0.0:6669"
    retention: 60
  pyroscope:
    # Because of known-issues: https://github.com/grafana/pyroscope-rs/issues/174
    # https://github.com/tikv/pprof-rs/issues/232 Therefore it is not enabled by default for now.
    enabled: false
    server-url: "http://localhost:4040"
    tags: []
    sample-rate: 0.1
  # Notice: More OTEL custom configuration use to env: OTEL_SPAN_xxx, see: opentelemetry_sdk::trace::config::default()
  otel:
    enabled: true
    endpoint: "http://localhost:4317"
    protocol: grpc # Optional: http/protobuf,http/json,grpc
    timeout: 10000

logging:
  mode: HUMAN # Options: HUMAN|JSON
  level: DEBUG

swagger:
  enabled: true
  # title: "My Webnote API Server"
  # description: "The My Webnote API Server"
  # version: "1.0.0"
  # license_name: "Apache 2.0"
  # license_url: "https://www.apache.org/licenses/LICENSE-2.0"
  # contact_name: "SigBot API"
  # contact_email: "jameswong1376@gmail.com"
  # contact_url: "https://github.com/wl4g/my-webnote"
  # terms_of_service: "api/terms-of-service"
  ui_path: "/swagger-ui"
  openapi_url: "/swagger-ui/openapi.json"

auth:
  jwt-ak-name: "_ak"
  jwt-rk-name: "_rk"
  jwt-validity-ak: 3600000
  jwt-validity-rk: 86400000
  jwt-algorithm: "HS256"
  #jwt-secret: "<YOUR_JWT_SECRET>" # Generated by default. Refer to: .env
  anonymous-paths:
    - "/public/**"
    - "/static/**"
    # The default healthly urls.
    - "/_/healthz"
    - "/_/healthz/**"
    # The default swagger ui urls.
    - "/swagger-ui/**" # e.g: swagger-ui/{index.css,openapi.json,...}
  oidc:
    enabled: false
    client-id: "<YOUR_OIDC_CLIENT_ID>" # Refer to: .env
    #client-secret: "<YOUR_OIDC_CLIENT_SECRET>" # Refer to: .env
    issue-url: "https://iam.wl4g.com/realms/master"
    #redirect-url: "http://localhost:8888/serve/auth/callback/oidc"
    redirect-url: "http://wl4g.local:10000/serve/auth/callback/oidc"
    scope: "openid profile email"
  # see:https://github.com/settings/developers
  # see:https://docs.github.com/en/apps/oauth-apps/building-oauth-apps/authorizing-oauth-apps
  github:
    enabled: true
    #client-id: "<YOUR_GITHUB_CLIENT_ID>" # Refer to: .env
    #client-secret: "<YOUR_GITHUB_CLIENT_SECRET>" # Refer to: .env
    auth-url: "https://github.com/login/oauth/authorize"
    token-url: "https://github.com/login/oauth/access_token"
    #redirect-url: "http://localhost:8888/serve/auth/callback/github"
    redirect-url: "http://wl4g.local:10000/serve/auth/callback/github"
    # see:https://docs.github.com/en/apps/oauth-apps/building-oauth-apps/scopes-for-oauth-apps
    scope: "user"
    user-info-url: "https://api.github.com/user"
  login-url: "/static/login.html"
  success-url: "/static/index.html"
  unauthz-url: "/static/403.html"

cache:
  provider: Memory # Memory|Redis
  memory:
    initial-capacity: 32
    max-capacity: 65535
    ttl: 3600000
    eviction-policy: LRU
  redis:
    nodes: ["redis://127.0.0.1:6379"]
    username: "default" # eg: "default"
    password: "bitnami" # eg: "bitnami", refer to: .env
    connection-timeout: 3000
    response-timeout: 6000
    retries: 1
    max-retry-wait: 65536
    min-retry-wait: 1280
    read-from-replica: true

appdb:
  type: "SQLITE" # Options: SQLITE|POSTGRESQL|MONGODB
  sqlite:
    dir: "/tmp/sigbot/appdb/sqlite"
  postgres: # App DB for PostgreSQL
    host: "127.0.0.1"
    port: 5432
    database: "postgres"
    schema: "public"
    username: postgres
    password: "changeit"
    min-connections: 1
    max-connections: 10
    use-ssl: false
  mongodb:
    url: mongodb://127.0.0.1:27017/sigbot
    database: sigbot

# see:https://platform.openai.com/docs/guides/completions
# see:https://github.com/ollama/ollama/blob/main/docs/api.md#generate-a-completion
# see:https://help.aliyun.com/zh/model-studio/getting-started/what-is-model-studio#16693d2e3fmir
llm:
  vecdb:
    type: "PGVECTOR" # Options: PGVECTOR
    pg-vector: # Vector DB for PostgreSQL
      host: "127.0.0.1"
      port: 5432
      database: "postgres"
      schema: "public"
      username: "postgres"
      password: "changeit"
      min-connections: 1
      max-connections: 10
      use-ssl: false
  embedding:
    api-uri: "http://localhost:11434/api/embed"
    #api-key: "<YOUR EMBEDDING API KEY>" # refer to:./.env
    model: "bge-m3:latest"
    org-id: # Optional
    project-id: # Optional
    pre-delete-collection: false
    vector-dimensions: 1536
  generate:
    # Notice: The '__' should be used to distinguish different levels of structure properties, such as:
    # SIGBOT__LLM__API_KEY to match SigBotProperties{llm:LlmProperties{completion:GenerateProperties{api_key}}}
    api-uri: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    #api-key: "<YOUR GENERATE API KEY>" # refer to:./.env
    org-id: # Optional
    project-id: # Optional
    model: "qwen-plus"
    max-tokens: 65535
    temperature: 0.1
    candidate-count: 3
    top-k: 1
    top-p: 0.9
    system-prompt: |-
      You are a security expert.
      You are given a list of rules and a request.
      You must determine if the request is safe or not.
      If the request is safe, you must return "safe".
      If the request is not safe, you must return "unsafe" and provide a reason.
      You must also provide a list of rules that were used to determine the result.
      You must also providea list of rules that were not used to determine the result.

services:
  # The Trading exchange configuration.
  exchanges:
    binance:
      # Spot
      spot-api-mainnet-endpoint: https://api.binance.com/api/v3 # https://api-gcp.binance.com,https://api2.binance.com,https://api3.binance.com,https://api4.binance.com
      spot-api-testnet-endpoint: wss://stream.testnet.binance.vision/ws
      spot-ws-mainnet-endpoint: wss://ws-api.binance.com:443/ws-api/v3
      spot-ws-testnet-endpoint: wss://ws-api.testnet.binance.vision/ws-api/v3
      # Spot-market
      spot-market-api-mainnet-endpoint: https://api.binance.com/api/v3
      spot-market-ws-mainnet-endpoint: wss://stream.binance.com:443
      # USDS-derivatives
      usds-api-mainnet-endpoint: https://fapi.binance.com/fapi/v1
      usds-api-testnet-endpoint: https://demo-fapi.binance.com
      usds-ws-mainnet-endpoint: wss://ws-fapi.binance.com/ws-fapi/v1
      usds-ws-testnet-endpoint: wss://fstream.binancefuture.com
      # USDS-derivatives-market
      usds-market-api-mainnet-endpoint: https://fapi.binance.com
      usds-market-ws-mainnet-endpoint: wss://fstream.binance.com
      # Coin-derivatives
      coin-api-mainnet-endpoint: https://dapi.binance.com/dapi/v1
      coin-api-testnet-endpoint: https://testnet.binancefuture.com
      coin-ws-mainnet-endpoint: wss://ws-dapi.binance.com/ws-dapi/v1
      coin-ws-testnet-endpoint: wss://dstream.binancefuture.com
      # Coin-derivatives-market
      coin-market-api-mainnet-endpoint: https://dapi.binance.com/dapi/v1
      coin-market-ws-mainnet-endpoint: wss://ws-dapi.binance.com/ws-dapi/v1
  # The Trading executor configuration.
  executors:
    - name: "defaultExecutor"
      kind: "SIMPLE_LLM"
      enabled: true
      # e.g: export SIGBOT__SERVICES__EXECUTORS[0]__CRON="0 * * * * *"
      #cron: "0 * * * * *"
      channel-size: 200
  # The Trading backtest configuration.
  backtests:
    - name: "defaultVerifier"
      kind: "SIMPLE_EXECUTE"
      enabled: true
      cron: "0 * * * * *"
      channel-size: 200
