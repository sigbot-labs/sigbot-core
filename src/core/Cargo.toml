[package]
name = "sigbot-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
common-context.workspace = true
authguard-adapter-rust.workspace = true
# Other modules dependencies.
common-audit-log.workspace = true
common-telemetry.workspace = true
sigbot-types.workspace = true
sigbot-utils.workspace = true

# Thridparty dependencies.
axum.workspace = true
hyper = { workspace = true, features = ["full"] }
tower = { workspace = true }
tower-http = { workspace = true, features = ["trace", "auth"] }
tower-cookies = { workspace = true }
lazy_static.workspace = true
clap.workspace = true
uuid.workspace = true
serde.workspace = true
validator.workspace = true
tokio.workspace = true
config.workspace = true
chrono.workspace = true
once_cell.workspace = true
arc-swap.workspace = true
async-trait.workspace = true
reqwest = { workspace = true, features = ["json"] }
anyhow.workspace = true
dotenv.workspace = true
thiserror.workspace = true
serde_json.workspace = true
serde_path_to_error = "0.1.20"
regex.workspace = true
futures.workspace = true

# Lang libs
base64 = { workspace = true}
hex = { workspace = true}

# Database libs
rust_decimal.workspace = true
sqlx = { workspace = true, features = [
    "runtime-tokio-rustls",
    "sqlite",
    "macros",
    "chrono",
    "postgres",
    "runtime-tokio-native-tls"
] }
# LLM AI libs
openai.workspace = true
langchain-rust.workspace = true
pgvector.workspace = true
# OAuth2 libs
url.workspace = true
# Encrypt libs
openssl = { workspace = true }
rsa = { workspace = true }
sha2 = { workspace = true }
# Cache libs
moka = { workspace = true, features = ["future"] }
redis = { workspace = true, features = ["tokio-comp", "cluster-async"] }
# Ethers libs
eyre = { workspace = true }
# APM libs
prometheus.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json", "env-filter"] }
tracing-opentelemetry.workspace = true
tracing-futures.workspace = true
tracing-attributes.workspace = true
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["rt-tokio"] }
opentelemetry-otlp = { workspace = true, features = ["grpc-tonic"] }
console-subscriber = { version = "0.1", optional = true }
zip = "=2.3.0"

[build-dependencies]
chrono.workspace = true
# Notice: Must force set the version of zip to 2.3.0 due to the used lower grammar static str of utoipa-swagger-ui, 
# will cause the build error such as : 'expected `Cow<'_, str>`, found `&str`'.
# see1:https://github1s.com/juhaku/utoipa/blob/utoipa-swagger-ui-9.0.0/utoipa-swagger-ui/Cargo.toml#L52-L53
# see2:https://github1s.com/juhaku/utoipa/blob/utoipa-swagger-ui-9.0.0/utoipa-swagger-ui/build.rs#L105-L106
zip = "=2.3.0"

[features]
default = []
testing = []
profiling-tokio-console = ["common-telemetry/profiling-tokio-console", "dep:console-subscriber"]

[[bench]]
name = "bench_main"
path = "benches/bench_main.rs"
harness = false

[dev-dependencies]
globset.workspace = true
percent-encoding.workspace = true
criterion.workspace = true

[[test]]
name = "authguard_integration"
path = "tests/context/authguard_test.rs"

[[test]]
name = "scoped_query"
path = "tests/storage/scoped_query_test.rs"

[[test]]
name = "mgmt_health"
path = "tests/mgmt/health_test.rs"
