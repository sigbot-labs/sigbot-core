server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
    location = /healthz { access_log off; return 200 'ok'; }
    # The Gateway owns API and Hosted Login routes on this same browser origin.
    location /api/ { return 404; }
    location /auth/ { return 404; }
    location /assets/ { add_header Cache-Control 'public, max-age=31536000, immutable'; try_files $uri =404; }
    location / { add_header Cache-Control 'no-store'; try_files $uri $uri/ /index.html; }
}
