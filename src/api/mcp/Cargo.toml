[package]
name = "sigbot-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Internal workspace dependencies
common-context.workspace = true
sigbot-core.workspace = true
sigbot-types.workspace = true

# MCP Official SDK from rust-mcp-stack
# GitHub: https://github.com/rust-mcp-stack/rust-mcp-sdk
# Features: Server, Client, SSE, STDIO, Streamable HTTP, Auth
rust-mcp-sdk = { version = "0.9.0", default-features = false, features = [
    "auth",
    "server",
    "hyper-server",
] }

# Core dependencies
tokio.workspace = true
async-trait.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
axum-server = "0.7.3"
axum.workspace = true
sha2.workspace = true

# Optional: ADK integration via adapter (not core dependency)
# adk-core = { version = "0.2.0", optional = true }
# adk-tool = { version = "0.2.0", optional = true }

[dev-dependencies]
reqwest.workspace = true
authguard-adapter-rust.workspace = true

