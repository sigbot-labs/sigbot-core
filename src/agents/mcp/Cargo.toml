[package]
name = "sigbot-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Internal workspace dependencies
common-telemetry.workspace = true
common-error.workspace = true
sigbot-types.workspace = true
sigbot-utils.workspace = true
sigbot-core.workspace = true

# MCP Official SDK from rust-mcp-stack
# GitHub: https://github.com/rust-mcp-stack/rust-mcp-sdk
# Features: Server, Client, SSE, STDIO, Streamable HTTP, Auth
rust-mcp-sdk = { version = "0.9.0", default-features = false, features = [
    "server",
    "client",
    "stdio",
    "sse",
    "macros",
] }

# Core dependencies
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
anyhow.workspace = true
thiserror.workspace = true
chrono.workspace = true
uuid.workspace = true
tracing.workspace = true
futures.workspace = true

# For MCP Client HTTP requests
reqwest.workspace = true

# Optional: ADK integration via adapter (not core dependency)
# adk-core = { version = "0.2.0", optional = true }
# adk-tool = { version = "0.2.0", optional = true }

[features]
default = []
# adk-adapter = ["dep:adk-core", "dep:adk-tool"]
