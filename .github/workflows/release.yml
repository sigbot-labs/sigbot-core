name: Release
on:
  pull_request:
    types: [closed]
concurrency:
  group: sigbot-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  prepare:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      epoch: ${{ steps.version.outputs.epoch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Derive immutable release version
        id: version
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 .github/scripts/release-version.py
  images:
    name: Rebuild images (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, platform: linux/amd64, runner: ubuntu-24.04}
          - {arch: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Rebuild runtime from the merge commit
        id: runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            RUST_BUILDER_IMAGE=docker.io/library/rust:1.99.1-slim
            BUILD_COMMIT_ID=${{ github.event.pull_request.merge_commit_sha }}
            BUILD_TAG=${{ needs.prepare.outputs.version }}
            SOURCE_DATE_EPOCH=${{ needs.prepare.outputs.epoch }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/sigbot,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=sigbot-runtime-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=sigbot-runtime-${{ matrix.arch }},ignore-error=true
      - name: Rebuild web from the merge commit
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/sigbot-web,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=sigbot-web-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=sigbot-web-${{ matrix.arch }},ignore-error=true
      - name: Export immutable image digests and binaries
        env:
          RUNTIME_DIGEST: ${{ steps.runtime.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          ARCH: ${{ matrix.arch }}
          REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: |
          mkdir -p dist/digests/runtime dist/digests/web dist/bin
          touch "dist/digests/runtime/${RUNTIME_DIGEST#sha256:}" "dist/digests/web/${WEB_DIGEST#sha256:}"
          docker pull "${REGISTRY}/sigbot@${RUNTIME_DIGEST}"
          container=$(docker create "${REGISTRY}/sigbot@${RUNTIME_DIGEST}")
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "${container}:/usr/local/bin/sigbot" "dist/bin/sigbot-linux-${ARCH}"
          docker cp "${container}:/usr/local/bin/sigbot-strategy-worker" "dist/bin/sigbot-strategy-worker-linux-${ARCH}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: dist/
          retention-days: 7
  chart:
    name: Package Helm
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.0
      - name: Package merge-commit chart
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: make package-chart VERSION="$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: release-chart
          path: dist/*.tgz
          retention-days: 7
  publish:
    name: Publish and pull-verify official artifacts
    needs: [prepare, images, chart]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.0
      - name: Publish version and latest indexes after all builds succeed
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: |
          for image in runtime web; do
            name=sigbot; if [ "$image" = web ]; then name=sigbot-web; fi
            mapfile -t digests < <(find "dist/digests/${image}" -type f -printf "${REGISTRY}/${name}@sha256:%f\n" | sort)
            test "${#digests[@]}" -eq 2
            docker buildx imagetools create --tag "${REGISTRY}/${name}:${VERSION}" --tag "${REGISTRY}/${name}:latest" "${digests[@]}"
            docker buildx imagetools inspect "${REGISTRY}/${name}:${VERSION}"
          done
      - name: Publish and pull-verify Helm
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm push "dist/sigbot-${VERSION}.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"
          mkdir verify
          helm pull "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts/sigbot" --version "$VERSION" --destination verify
          cmp "dist/sigbot-${VERSION}.tgz" "verify/sigbot-${VERSION}.tgz"
      - name: Tag the verified merge commit
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            test "$(git rev-parse "${TAG}^{commit}")" = "$MERGE_SHA"
          else
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git tag -a "$TAG" "$MERGE_SHA" -m "Release ${TAG}"
            git push origin "$TAG"
          fi
          sha256sum dist/bin/* dist/*.tgz > dist/SHA256SUMS
      - name: Upload binaries and Helm archive to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/bin/*
            dist/*.tgz
            dist/SHA256SUMS
  report:
    needs: [prepare, images, chart, publish]
    if: always() && github.event.pull_request.merged == true && github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Update the same PR status comment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SIGBOT_PR_NUMBER: ${{ github.event.pull_request.number }}
          SIGBOT_HEAD_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          SIGBOT_COMMENT_KIND: release
          SIGBOT_COMMENT_PHASE: completed
          SIGBOT_ARTIFACT_VERSION: ${{ needs.prepare.outputs.version }}
          SIGBOT_RESULTS: ${{ toJSON(needs) }}
          SIGBOT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/upsert-pr-status-comment.mjs
