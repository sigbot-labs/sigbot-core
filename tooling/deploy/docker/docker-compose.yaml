version: '3.8'

x-shared-env: &shared-env
  RUST_BACKTRACE: full
  SIGBOT__SWAGGER__ENABLED: ${SWAGGER_ENABLED:-true}
  SIGBOT__LOGGING__MODE: ${LOGGING_MODE:-JSON}
  SIGBOT__LOGGING__LEVEL: ${LOGGING_LEVEL:-DEBUG}
  SIGBOT__CACHE__PROVIDER: ${CACHE_PROVIDER:-Redis}
  SIGBOT__CACHE__REDIS__NODES: ${REDIS_NODES:-redis://127.0.0.1:6379}
  SIGBOT__CACHE__REDIS__PASSWORD: ${REDIS_PASSWORD:-}
  SIGBOT__APPDB__TYPE: ${APPDB_TYPE:-POSTGRESQL}
  SIGBOT__APPDB__POSTGRES__HOST: ${POSTGRES_HOST:-appdb}
  SIGBOT__APPDB__POSTGRES__PORT: ${POSTGRES_PORT:-5432}
  SIGBOT__APPDB__POSTGRES__USERNAME: ${POSTGRES_USER:-postgres}
  SIGBOT__APPDB__POSTGRES__PASSWORD: ${POSTGRES_PASSWORD:-changeit}
  SIGBOT__APPDB__POSTGRES__DATABASE: ${POSTGRES_DATABASE:-postgres}
  SIGBOT__APPDB__POSTGRES__SCHEMA: ${POSTGRES_SCHEMA:-public}
  SIGBOT__APPDB__POSTGRES__MIN_CONNECTIONS: ${POSTGRES_MIN_CONNECTION:-1}
  SIGBOT__APPDB__POSTGRES__MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTION:-10}
  SIGBOT__LLM__VECDB__TYPE: ${VECDB_TYPE:-PGVECTOR}
  SIGBOT__LLM__VECDB__PG_VECTOR__HOST: ${PGVECTOR_HOST:-pgvector}
  SIGBOT__LLM__VECDB__PG_VECTOR__PORT: ${PGVECTOR_PORT:-5432}
  SIGBOT__LLM__VECDB__PG_VECTOR__USERNAME: ${PGVECTOR_USER:-postgres}
  SIGBOT__LLM__VECDB__PG_VECTOR__PASSWORD: ${PGVECTOR_PASSWORD:-changeit}
  SIGBOT__LLM__VECDB__PG_VECTOR__DATABASE: ${PGVECTOR_DATABASE:-postgres}
  SIGBOT__LLM__VECDB__PG_VECTOR__SCHEMA: ${PGVECTOR_SCHEMA:-public}
  SIGBOT__LLM__VECDB__PG_VECTOR__MIN_CONNECTIONS: ${PGVECTOR_MIN_CONNECTION:-1}
  SIGBOT__LLM__VECDB__PG_VECTOR__MAX_CONNECTIONS: ${PGVECTOR_MAX_CONNECTION:-10}
  SIGBOT__LLM__EMBEDDING__API_KEY: ${SIGBOT_LLM_EMBEDDING_API_KEY:-}
  SIGBOT__LLM__EMBEDDING__MODEL: ${SIGBOT_LLM_EMBEDDING_MODEL:-}
  SIGBOT__LLM__GENERATE__API_KEY: ${SIGBOT_LLM_GENERATE_API_KEY:-}
  SIGBOT__LLM__GENERATE__MODEL: ${SIGBOT_LLM_GENERATE_MODEL:-}
  SIGBOT__FORWARDER__MAX_BODY_BYTES: ${SIGBOT_FORWARDER_MAX_BODY_BYTES:-65535}
  SIGBOT__FORWARDER__CONNECT_TIMEOUT: ${SIGBOT_FORWARDER_CONNECT_TIMEOUT:-5}
  SIGBOT__FORWARDER__READ_TIMEOUT: ${SIGBOT_FORWARDER_READ_TIMEOUT:-10}
  SIGBOT__FORWARDER__TOTAL_TIMEOUT: ${SIGBOT_FORWARDER_TOTAL_TIMEOUT:-15}

services:
  # System database for storing tenant and system configuration
  appdb:
    image: registry.cn-shenzhen.aliyuncs.com/wl4g/pgvector_pgvector:pg16
    restart: unless-stopped
    environment:
      PGUSER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeit}
      POSTGRES_DB: ${POSTGRES_DATABASE:-sigbot_sysdb}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - appdb_data:/var/lib/postgresql/data
    networks:
      - sigbot-core
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Vector database for LLM embeddings
  pgvector:
    image: registry.cn-shenzhen.aliyuncs.com/wl4g/pgvector_pgvector:pg16
    restart: unless-stopped
    environment:
      PGUSER: ${PGVECTOR_USER:-postgres}
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:-changeit}
      POSTGRES_DB: ${PGVECTOR_DATABASE:-sigbot_vecdb}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    networks:
      - sigbot-core
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGVECTOR_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    networks:
      - sigbot-core
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # API Server
  server:
    image: ${SIGBOT_IMAGE:-registry.cn-shenzhen.aliyuncs.com/wl4g/sigbot-core:latest}
    restart: unless-stopped
    command: server
    security_opt:
      - seccomp=unconfined
    environment:
      <<: *shared-env
    ports:
      - "${SERVER_PORT:-9000}:9000"
    depends_on:
      appdb:
        condition: service_healthy
      pgvector:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - sigbot_storage:/var/lib/sigbot/storage
    networks:
      - sigbot-core

  # SigBot Deployer - manages tenant lifecycle and component deployment
  deployer:
    image: ${SIGBOT_IMAGE:-registry.cn-shenzhen.aliyuncs.com/wl4g/sigbot-core:latest}
    restart: unless-stopped
    command: deployer --runtime-mode=${DEPLOYER_MODE:-docker}
    security_opt:
      - seccomp=unconfined
    environment:
      <<: *shared-env
      DEPLOYER_MODE: ${DEPLOYER_MODE:-docker}
      DOCKER_HOST: ${DOCKER_HOST:-unix:///var/run/docker.sock}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - sigbot_storage:/var/lib/sigbot/storage
    depends_on:
      appdb:
        condition: service_healthy
      pgvector:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sigbot-core

  # Executor (for general task execution)
  executor:
    image: ${SIGBOT_IMAGE:-registry.cn-shenzhen.aliyuncs.com/wl4g/sigbot-core:latest}
    restart: unless-stopped
    command: executor
    security_opt:
      - seccomp=unconfined
    environment:
      <<: *shared-env
    depends_on:
      appdb:
        condition: service_healthy
      pgvector:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - sigbot_storage:/var/lib/sigbot/storage
    networks:
      - sigbot-core

volumes:
  appdb_data:
    driver: local
  pgvector_data:
    driver: local
  redis_data:
    driver: local
  sigbot_storage:
    driver: local

networks:
  sigbot-core:
    driver: bridge
    name: sigbot-core

