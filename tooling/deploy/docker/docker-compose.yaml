version: '3.8'

x-shared-env: &shared-env
  RUST_BACKTRACE: full
  SWAGGER__ENABLED: ${SWAGGER_ENABLED:-true}
  LOGGING__MODE: ${LOGGING_MODE:-JSON}
  LOGGING__LEVEL: ${LOGGING_LEVEL:-DEBUG}
  CACHE__PROVIDER: ${CACHE_PROVIDER:-Redis}
  CACHE__REDIS__NODES: ${REDIS_NODES:-redis://127.0.0.1:6379}
  CACHE__REDIS__PASSWORD: ${REDIS_PASSWORD:-}
  DATABASE__SYSTEMDB__HOST: ${POSTGRES_HOST:-systemdb}
  DATABASE__SYSTEMDB__PORT: ${POSTGRES_PORT:-5432}
  DATABASE__SYSTEMDB__USER: ${POSTGRES_USER:-postgres}
  DATABASE__SYSTEMDB__PASSWORD: ${POSTGRES_PASSWORD:-changeit}
  DATABASE__SYSTEMDB__DATABASE: ${POSTGRES_DATABASE:-sigbot}
  DATABASE__SYSTEMDB__MIN_CONNECTION: ${POSTGRES_MIN_CONNECTION:-1}
  DATABASE__SYSTEMDB__MAX_CONNECTION: ${POSTGRES_MAX_CONNECTION:-10}
  DATABASE__PGVECTOR__HOST: ${POSTGRES_HOST:-pgvector}
  DATABASE__PGVECTOR__PORT: ${POSTGRES_PORT:-5432}
  DATABASE__PGVECTOR__USER: ${POSTGRES_USER:-postgres}
  DATABASE__PGVECTOR__PASSWORD: ${POSTGRES_PASSWORD:-changeit}
  DATABASE__PGVECTOR__DATABASE: ${POSTGRES_DATABASE:-sigbot}
  DATABASE__PGVECTOR__MIN_CONNECTION: ${POSTGRES_MIN_CONNECTION:-1}
  DATABASE__PGVECTOR__MAX_CONNECTION: ${POSTGRES_MAX_CONNECTION:-10}
  SIGBOT__LLM__EMBEDDING__API_KEY: ${SIGBOT_LLM_EMBEDDING_API_KEY:-}
  SIGBOT__LLM__EMBEDDING__MODEL: ${SIGBOT_LLM_EMBEDDING_MODEL:-}
  SIGBOT__LLM__GENERATE__API_KEY: ${SIGBOT_LLM_GENERATE_API_KEY:-}
  SIGBOT__LLM__GENERATE__MODEL: ${SIGBOT_LLM_GENERATE_MODEL:-}
  SIGBOT__FORWARDER__MAX_BODY_BYTES: ${SIGBOT_FORWARDER_MAX_BODY_BYTES:-65535}
  SIGBOT__FORWARDER__CONNECT_TIMEOUT: ${SIGBOT_FORWARDER_CONNECT_TIMEOUT:-5}
  SIGBOT__FORWARDER__READ_TIMEOUT: ${SIGBOT_FORWARDER_READ_TIMEOUT:-10}
  SIGBOT__FORWARDER__TOTAL_TIMEOUT: ${SIGBOT_FORWARDER_TOTAL_TIMEOUT:-15}

services:
  # System database for storing tenant and system configuration
  systemdb:
    image: registry.cn-shenzhen.aliyuncs.com/wl4g/pgvector_pgvector:pg16
    restart: unless-stopped
    environment:
      PGUSER: ${DATABASE__SYSTEMDB__USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE__SYSTEMDB__PASSWORD:-changeit}
      POSTGRES_DB: ${DATABASE__SYSTEMDB__DATABASE:-sigbot_sysdb}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - systemdb_data:/var/lib/postgresql/data
    networks:
      - sigbot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE__SYSTEMDB__USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Vector database for LLM embeddings
  pgvector:
    image: registry.cn-shenzhen.aliyuncs.com/wl4g/pgvector_pgvector:pg16
    restart: unless-stopped
    environment:
      PGUSER: ${DATABASE__PGVECTOR__USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE__PGVECTOR__PASSWORD:-changeit}
      POSTGRES_DB: ${DATABASE__PGVECTOR__DATABASE:-sigbot_vecdb}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    networks:
      - sigbot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE__PGVECTOR__USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    networks:
      - sigbot
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # SigBot Deployer - manages tenant lifecycle and component deployment
  deployer:
    image: ${SIGBOT_IMAGE:-registry.cn-shenzhen.aliyuncs.com/wl4g/sigbot:latest}
    restart: unless-stopped
    command: deployer --runtime-mode=${DEPLOYER_MODE:-docker}
    security_opt:
      - seccomp=unconfined
    environment:
      <<: *shared-env
      DEPLOYER_MODE: ${DEPLOYER_MODE:-docker}
      DOCKER_HOST: ${DOCKER_HOST:-unix:///var/run/docker.sock}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - sigbot_storage:/var/lib/sigbot/storage
    depends_on:
      systemdb:
        condition: service_healthy
      pgvector:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sigbot

  # API Server
  server:
    image: ${SIGBOT_IMAGE:-registry.cn-shenzhen.aliyuncs.com/wl4g/sigbot:latest}
    restart: unless-stopped
    command: server
    security_opt:
      - seccomp=unconfined
    environment:
      <<: *shared-env
    ports:
      - "${SERVER_PORT:-9000}:9000"
    depends_on:
      systemdb:
        condition: service_healthy
      pgvector:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - sigbot_storage:/var/lib/sigbot/storage
    networks:
      - sigbot

  # Executor (for general task execution)
  executor:
    image: ${SIGBOT_IMAGE:-registry.cn-shenzhen.aliyuncs.com/wl4g/sigbot:latest}
    restart: unless-stopped
    command: executor
    security_opt:
      - seccomp=unconfined
    environment:
      <<: *shared-env
    depends_on:
      systemdb:
        condition: service_healthy
      pgvector:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - sigbot_storage:/var/lib/sigbot/storage
    networks:
      - sigbot

volumes:
  systemdb_data:
    driver: local
  pgvector_data:
    driver: local
  redis_data:
    driver: local
  sigbot_storage:
    driver: local

networks:
  sigbot:
    driver: bridge
    name: sigbot

