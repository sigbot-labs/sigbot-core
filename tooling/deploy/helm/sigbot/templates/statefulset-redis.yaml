{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "sigbot.fullname" . }}-redis
  labels:
    {{- include "sigbot.labels" . | nindent 4 }}
    component: redis
spec:
  serviceName: {{ include "sigbot.fullname" . }}-redis
  replicas: 1
  selector:
    matchLabels:
      {{- include "sigbot.selectorLabels" . | nindent 6 }}
      component: redis
  template:
    metadata:
      labels:
        {{- include "sigbot.selectorLabels" . | nindent 8 }}
        component: redis
    spec:
      containers:
        - name: redis
          image: "{{ .Values.redis.image.registry }}/{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: IfNotPresent
          command:
            - redis-server
            - --appendonly
            - "yes"
            {{- if .Values.redis.auth.password }}
            - --requirepass
            - {{ .Values.redis.auth.password | quote }}
            {{- end }}
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - redis-cli
                {{- if .Values.redis.auth.password }}
                - -a
                - {{ .Values.redis.auth.password | quote }}
                {{- end }}
                - ping
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - redis-cli
                {{- if .Values.redis.auth.password }}
                - -a
                - {{ .Values.redis.auth.password | quote }}
                {{- end }}
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        {{- if .Values.redis.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "sigbot.fullname" . }}-redis
        {{- else }}
        - name: data
          emptyDir: {}
        {{- end }}
---
{{- end }}

