{{- if .Values.systemdb.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "sigbot.fullname" . }}-systemdb
  labels:
    {{- include "sigbot.labels" . | nindent 4 }}
    component: systemdb
spec:
  serviceName: {{ include "sigbot.fullname" . }}-systemdb
  replicas: 1
  selector:
    matchLabels:
      {{- include "sigbot.selectorLabels" . | nindent 6 }}
      component: systemdb
  template:
    metadata:
      labels:
        {{- include "sigbot.selectorLabels" . | nindent 8 }}
        component: systemdb
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: postgresql
          image: "{{ .Values.systemdb.image.registry }}/{{ .Values.systemdb.image.repository }}{{ if .Values.systemdb.image.digest }}@{{ .Values.systemdb.image.digest }}{{ else }}:{{ .Values.systemdb.image.tag }}{{ end }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: {{ .Values.systemdb.auth.postgresUser | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.systemdb.auth.existing_secret }}
                  key: {{ .Values.systemdb.auth.password_key }}
            - name: POSTGRES_DB
              value: {{ .Values.systemdb.auth.postgresDatabase | quote }}
            - name: PGDATA
              value: /home/postgres/pgdata/data/pgdata
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          volumeMounts:
            - {name: extensions, mountPath: /docker-entrypoint-initdb.d/20-extensions.sql, subPath: 20-extensions.sql, readOnly: true}
            - name: data
              mountPath: /home/postgres/pgdata/data
          resources:
            {{- toYaml .Values.systemdb.resources | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.systemdb.auth.postgresUser }}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.systemdb.auth.postgresUser }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: extensions
          configMap: {name: {{ include "sigbot.fullname" . }}-postgres-extensions}
        {{- if .Values.systemdb.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "sigbot.fullname" . }}-systemdb
        {{- else }}
        - name: data
          emptyDir: {}
        {{- end }}
---
{{- end }}

