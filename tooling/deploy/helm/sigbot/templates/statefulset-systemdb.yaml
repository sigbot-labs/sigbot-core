{{- if .Values.systemdb.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "sigbot.fullname" . }}-systemdb
  labels:
    {{- include "sigbot.labels" . | nindent 4 }}
    component: systemdb
spec:
  serviceName: {{ include "sigbot.fullname" . }}-systemdb
  replicas: 1
  selector:
    matchLabels:
      {{- include "sigbot.selectorLabels" . | nindent 6 }}
      component: systemdb
  template:
    metadata:
      labels:
        {{- include "sigbot.selectorLabels" . | nindent 8 }}
        component: systemdb
    spec:
      containers:
        - name: postgresql
          image: "{{ .Values.systemdb.image.registry }}/{{ .Values.systemdb.image.repository }}:{{ .Values.systemdb.image.tag }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: PGUSER
              value: {{ .Values.systemdb.auth.postgresUser | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.systemdb.auth.postgresPassword | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.systemdb.auth.postgresDatabase | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            {{- toYaml .Values.systemdb.resources | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.systemdb.auth.postgresUser }}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.systemdb.auth.postgresUser }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        {{- if .Values.systemdb.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "sigbot.fullname" . }}-systemdb
        {{- else }}
        - name: data
          emptyDir: {}
        {{- end }}
---
{{- end }}

