{{- if and .Values.server.enabled .Values.server.gateway.enabled }}
{{- if not .Values.server.gateway.hostnames }}
{{- fail "server.gateway.hostnames must contain the real business domain" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "sigbot.fullname" . }}-api
  labels:
    authguard.io/protected: "true"
spec:
  parentRefs:
    - name: {{ .Values.server.gateway.name }}
      {{- with .Values.server.gateway.namespace }}
      namespace: {{ . }}
      {{- end }}
  hostnames:
    {{- toYaml .Values.server.gateway.hostnames | nindent 4 }}
  rules:
    - matches:
        - path: {type: PathPrefix, value: /api/}
        - path: {type: PathPrefix, value: /sys/tenant/}
      backendRefs:
        - name: {{ include "sigbot.fullname" . }}-server
          port: {{ .Values.server.service.port }}
{{- end }}
