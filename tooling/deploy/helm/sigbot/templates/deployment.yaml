{{- if .Values.server.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sigbot.fullname" . }}-server
  labels:
    {{- include "sigbot.labels" . | nindent 4 }}
    component: server
spec:
  replicas: {{ .Values.server.replicaCount }}
  selector:
    matchLabels:
      {{- include "sigbot.selectorLabels" . | nindent 6 }}
      component: server
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/platform/configmap.yaml") . | sha256sum }}
        checksum/controller: {{ include (print $.Template.BasePath "/platform/controller-configmap.yaml") . | sha256sum }}
        secrets/revision: {{ .Values.secrets.revision | quote }}
      labels:
        {{- include "sigbot.selectorLabels" . | nindent 8 }}
        component: server
    spec:
      automountServiceAccountToken: {{ .Values.deployer.enabled }}
      {{- if .Values.deployer.enabled }}
      serviceAccountName: {{ include "sigbot.serviceAccountName" . }}
      {{- end }}
      securityContext: {runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000}
      containers:
        - name: server
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sigbot", "api"]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          ports:
            - {name: http, containerPort: 9000}
          {{- if .Values.deployer.enabled }}
          env:
            - {name: SIGBOT_CFG_PATH, value: /etc/sigbot/controller.yaml}
          {{- end }}
          envFrom:
            - configMapRef: {name: {{ include "sigbot.fullname" . }}-runtime}
            - secretRef: {name: {{ required "secrets.existing_secret is required" .Values.secrets.existing_secret }}}
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          readinessProbe:
            httpGet: {path: /_/healthz, port: http}
          livenessProbe:
            httpGet: {path: /_/healthz, port: http}
          volumeMounts:
            - {name: storage, mountPath: /var/lib/sigbot/storage}
            {{- if .Values.deployer.enabled }}
            - {name: controller, mountPath: /etc/sigbot/controller.yaml, subPath: controller.yaml, readOnly: true}
            {{- end }}
      volumes:
        {{- if .Values.deployer.enabled }}
        - name: controller
          configMap: {name: {{ include "sigbot.fullname" . }}-controller}
        {{- end }}
        - name: storage
          {{- if .Values.persistence.storageClass }}
          persistentVolumeClaim: {claimName: {{ include "sigbot.fullname" . }}-storage}
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
