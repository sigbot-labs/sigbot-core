{{- if and .Values.deployer.enabled .Values.deployer.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sigbot.serviceAccountName" . }}
  labels:
    {{- include "sigbot.labels" . | nindent 4 }}
  {{- with .Values.deployer.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "sigbot.fullname" . }}-deployer
  labels:
    {{- include "sigbot.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods", "services", "configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "sigbot.fullname" . }}-deployer
  labels:
    {{- include "sigbot.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "sigbot.fullname" . }}-deployer
subjects:
  - kind: ServiceAccount
    name: {{ include "sigbot.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
{{- end }}

