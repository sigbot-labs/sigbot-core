{{- if .Values.minio.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sigbot.fullname" . }}-minio
spec:
  type: ClusterIP
  ports: [{name: s3, port: 9000, targetPort: s3}]
  selector:
    {{- include "sigbot.selectorLabels" . | nindent 4 }}
    component: minio
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "sigbot.fullname" . }}-minio
spec:
  serviceName: {{ include "sigbot.fullname" . }}-minio
  replicas: 1
  selector:
    matchLabels:
      {{- include "sigbot.selectorLabels" . | nindent 6 }}
      component: minio
  template:
    metadata:
      annotations:
        secrets/revision: {{ .Values.secrets.revision | quote }}
      labels:
        {{- include "sigbot.selectorLabels" . | nindent 8 }}
        component: minio
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000}
      containers:
        - name: minio
          image: "{{ .Values.minio.image.repository }}:{{ .Values.minio.image.tag }}"
          args: [server, /data, --console-address, ':9001']
          ports: [{name: s3, containerPort: 9000}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: {name: {{ .Values.minio.existing_secret }}, key: MINIO_ROOT_USER}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.minio.existing_secret }}, key: MINIO_ROOT_PASSWORD}
          volumeMounts: [{name: data, mountPath: /data}]
          resources:
            {{- toYaml .Values.minio.resources | nindent 12 }}
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: s3}
          livenessProbe:
            httpGet: {path: /minio/health/live, port: s3}
      {{- if not .Values.minio.persistence.enabled }}
      volumes: [{name: data, emptyDir: {}}]
      {{- end }}
  {{- if .Values.minio.persistence.enabled }}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [{{ .Values.minio.persistence.accessMode }}]
        {{- with .Values.minio.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests: {storage: {{ .Values.minio.persistence.size }}}
  {{- end }}
{{- end }}
