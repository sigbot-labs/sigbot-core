{{- if .Values.deployer.enabled }}
{{- if not .Values.server.enabled }}{{ fail "shared worker controller requires server.enabled" }}{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sigbot.fullname" . }}-controller
data:
  controller.yaml: |
    authguard:
      service_tenant_id: {{ required "deployer.scope.tenant_id is required" .Values.deployer.scope.tenant_id }}
      service_space_id: {{ required "deployer.scope.space_id is required" .Values.deployer.scope.space_id }}
      service_env: {{ required "deployer.scope.env is required" .Values.deployer.scope.env | quote }}
      service_principal_id: {{ .Values.deployer.scope.principal_id | quote }}
    services:
      deployer:
        images:
          sigbot: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        workers:
          enabled: true
          provider: kubernetes
          namespace: {{ .Release.Namespace | quote }}
          runtime_secret: {{ required "secrets.worker_existing_secret is required for scoped workers" .Values.secrets.worker_existing_secret | quote }}
          secret_revision: {{ .Values.secrets.revision | quote }}
          runtime_config_map: {{ include "sigbot.fullname" . }}-runtime
          log_pvc_prefix: {{ .Values.deployer.worker_log_pvc_prefix | quote }}
          cpu_millis: {{ .Values.deployer.worker_resources.cpu_millis }}
          memory_mb: {{ .Values.deployer.worker_resources.memory_mb }}
          pids_limit: {{ .Values.deployer.worker_resources.pids_limit }}
          egress_cidrs: {{ .Values.deployer.egress_cidrs | toJson }}
          egress_ports: {{ .Values.deployer.egress_ports | toJson }}
{{- end }}
