{{- range $name, $service := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-{{ $name }}
spec:
  replicas: 1
  selector: {matchLabels: {app: "mock-{{ $name }}"}}
  template:
    metadata: {labels: {app: "mock-{{ $name }}"}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, fsGroup: 65532}
      containers:
        - name: boundary
          image: {{ $service.image | quote }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          ports: [{containerPort: 8080}]
          env:
            - name: MARKETPULSE_MOCK_TOKEN
              valueFrom: {secretKeyRef: {name: {{ $.Values.existingSecret }}, key: token}}
            - name: MARKETPULSE_PUBLIC_URL
              value: http://mock-{{ $name }}:8080
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          readinessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 3}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: "mock-{{ $name }}"}
spec:
  selector: {app: "mock-{{ $name }}"}
  ports: [{port: 8080, targetPort: 8080}]
{{- end }}
