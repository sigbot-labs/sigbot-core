services:
  mock-openai:
    build:
      context: ../..
      dockerfile: deploy/mock-openai-service/Dockerfile
    image: sigbot-marketpulse-openai:local
    environment:
      MARKETPULSE_MOCK_TOKEN: ${MARKETPULSE_MOCK_TOKEN:?required}
      MARKETPULSE_PUBLIC_URL: http://mock-openai:8080
    ports:
    - 127.0.0.1:18483:8080
    mem_limit: 256m
    cpus: '0.5'
    read_only: true
    tmpfs:
    - /tmp:size=32m
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')
      interval: 5s
      timeout: 3s
      retries: 20
