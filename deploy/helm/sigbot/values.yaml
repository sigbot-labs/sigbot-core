global:
  imageSource: global
  imageRegistry: ''
  imagePullSecrets: []
  storageClass: ''
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}

sigbot:
  sigbot-config: |
    server:
      host: 0.0.0.0
      port: 9000
    mgmt:
      enabled: true
      host: 0.0.0.0
      port: 9001
      health: {liveness_path: /_/livez, readiness_path: /_/healthz}
      metrics: {enabled: true, path: /metrics}
    logging: {mode: JSON, level: INFO}
    storage:
      provider: Postgres
      postgres: {host: sigbot-postgres, port: 5432, username: sigbot, password: '', database: sigbot}
    cache:
      provider: Redis
      redis: {nodes: [redis://sigbot-redis:6379], password: ''}
    authguard: {provider: signed_header, oauth: null} # Set the real issuer/discovery_url before enabling MCP.
    services:
      platform:
        api:
          http: {}
          a2a: {enabled: true, bind_address: 0.0.0.0:9003, public_url: ''}
          mcp: {enabled: true, bind_address: 0.0.0.0:9002, public_url: http://127.0.0.1:9002/mcp}
        controller:
          workers: {enabled: true, cpu_millis: 1000, memory_mb: 512, pids_limit: 64}
      component:
        messager: {provider: LOCAL, properties: {local_client_id: sigbot}}
        exchange: {}
        datafeed: {}
        evaluator: {}
        strategy: {}
        order: {}
        wallet: {}
        exporter: {}
        logger: {}
        notifier: {}
        backtest: {}
  image: &sigbotImage
    registry: ghcr.io/wl4g
    repository: sigbot
    tag: ''
    digest: ''
    pullPolicy: IfNotPresent
  api:
    enabled: true
    replicaCount: 1
    service: {type: ClusterIP, port: 9000}
    protocols:
      http: {enabled: true, port: 9000}
      mcp: {enabled: true, port: 9002, publicUrl: ''}
      a2a: {enabled: true, port: 9003, publicUrl: ''}
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {cpu: 1000m, memory: 2Gi}
    persistence: {storageClass: '', accessMode: ReadWriteOnce, size: 10Gi}
    ingress: {enabled: false, className: '', annotations: {}, hosts: [], tls: []}
    gateway: {enabled: false, name: authguard, namespace: '', hostnames: []}
  controller:
    enabled: true
    replicaCount: 1
    image: *sigbotImage
    scope: {principalId: workflow-controller}
    workerResources: {cpuMillis: 1000, memoryMb: 512, pidsLimit: 64}
    serviceAccount: {create: true, annotations: {}, name: ''}
    rbac: {create: true}
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 500m, memory: 1Gi}
    middleware:
      redis:
        image: docker.io/bitnami/redis-cluster:8.10
        resources: {cpu_millis: 500, memory_mb: 512, storage_gb: 8}
      pgvector:
        image: docker.io/pgvector/pgvector:pg18
        resources: {cpu_millis: 1000, memory_mb: 2048, storage_gb: 20}
      timescaledb:
        image: docker.io/timescale/timescaledb-ha:pg18
        resources: {cpu_millis: 1000, memory_mb: 2048, storage_gb: 50}
      emqx:
        image: docker.io/emqx/emqx:6.3.2
        resources: {cpu_millis: 1000, memory_mb: 1024, storage_gb: 20}
  web:
    enabled: true
    replicaCount: 1
    image:
      registry: ghcr.io/wl4g
      repository: sigbot-web
      tag: ''
      digest: ''
      pullPolicy: IfNotPresent
    resources:
      requests: {cpu: 20m, memory: 32Mi}
      limits: {cpu: 200m, memory: 128Mi}
  monitoring:
    enabled: false
    serviceMonitor: {enabled: false, interval: 30s, scrapeTimeout: 10s, labels: {}}
    grafana:
      enabled: false
      datasourceUid: prometheus
      folder: Sigbot
      sidecarLabel: grafana_dashboard
      sidecarLabelValue: '1'

middleware:
  authguard:
    enabled: true
    authguard:
      authn:
        image: {repository: ghcr.io/wl4g/authguard, tag: '1.0.2', pullPolicy: IfNotPresent}
      authz:
        image: {repository: ghcr.io/wl4g/authguard, tag: '1.0.2', pullPolicy: IfNotPresent}
      web:
        image: {repository: ghcr.io/wl4g/authguard-web, tag: '1.0.2', pullPolicy: IfNotPresent}
    envoy_gateway:
      global:
        images:
          envoyGateway: {image: docker.io/envoyproxy/gateway:v1.9.0, pullPolicy: IfNotPresent}
          envoyProxy: {image: docker.io/envoyproxy/envoy:distroless-v1.36.4, pullPolicy: IfNotPresent}
          ratelimit: {image: docker.io/envoyproxy/ratelimit:17b1956c, pullPolicy: IfNotPresent}
    redis_cluster:
      image: {registry: docker.io, repository: bitnami/redis-cluster, tag: 7.0.14, pullPolicy: IfNotPresent}
      existingSecret: authguard-secrets
      existingSecretPasswordKey: AUTHGUARD__CACHE__REDIS__PASSWORD
    postgresql:
      image: {registry: docker.io, repository: bitnami/postgresql, tag: '18.3'}
      auth:
        existingSecret: authguard-secrets
        secretKeys:
          adminPasswordKey: AUTHGUARD__STORAGE__POSTGRES__PASSWORD
          userPasswordKey: AUTHGUARD__STORAGE__POSTGRES__PASSWORD
    secrets:
      provider: kubernetes
      kubernetes: {existingSecret: authguard-secrets}
  postgres:
    enabled: true
    image:
      registry: docker.io/timescale
      repository: timescaledb-ha
      tag: ''
      digest: sha256:98f88217cb7be56655f842d9920f90d0b4893b67b3463f93084548b433ed5c93
      pullPolicy: IfNotPresent
    auth: {username: sigbot, database: sigbot, existingSecret: sigbot-runtime, passwordKey: POSTGRES_PASSWORD}
    extensions: [timescaledb, vector]
    persistence: {enabled: true, storageClass: '', accessMode: ReadWriteOnce, size: 20Gi}
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {cpu: 1000m, memory: 2Gi}
  redis:
    enabled: true
    nodes: 6
    replicas: 1
    image:
      registry: docker.io/bitnami
      repository: redis-cluster
      tag: '8.10'
      digest: ''
      pullPolicy: IfNotPresent
    auth: {existingSecret: sigbot-runtime, passwordKey: REDIS_PASSWORD}
    persistence: {enabled: true, storageClass: '', accessMode: ReadWriteOnce, size: 10Gi}
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 500m, memory: 1Gi}

secrets:
  provider: kubernetes
  existingSecret: sigbot-runtime
  workerExistingSecret: sigbot-workers
  revision: '1'
