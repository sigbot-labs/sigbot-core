{{- if and .Values.sigbot.api.enabled .Values.sigbot.api.gateway.enabled }}
{{- if not .Values.sigbot.api.gateway.hostnames }}
{{- fail "server.gateway.hostnames must contain the real business domain" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "sigbot.fullname" . }}-api
  labels:
    authguard.io/protected: "true"
spec:
  parentRefs:
    - name: {{ .Values.sigbot.api.gateway.name }}
      {{- with .Values.sigbot.api.gateway.namespace }}
      namespace: {{ . }}
      {{- end }}
  hostnames:
    {{- toYaml .Values.sigbot.api.gateway.hostnames | nindent 4 }}
  rules:
    - matches:
        - path: {type: PathPrefix, value: /api/}
      backendRefs:
        - name: {{ include "sigbot.fullname" . }}-server
          port: {{ .Values.sigbot.api.service.port }}
    {{- if .Values.sigbot.api.protocols.mcp.enabled }}
    - matches:
        - path: {type: Exact, value: /mcp}
      backendRefs:
        - name: {{ include "sigbot.fullname" . }}-server
          port: {{ .Values.sigbot.api.protocols.mcp.port }}
    {{- end }}
    {{- if .Values.sigbot.api.protocols.a2a.enabled }}
    - matches:
        - path: {type: PathPrefix, value: /a2a}
      backendRefs:
        - name: {{ include "sigbot.fullname" . }}-server
          port: {{ .Values.sigbot.api.protocols.a2a.port }}
    {{- end }}
{{- if .Values.sigbot.api.protocols.mcp.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "sigbot.fullname" . }}-mcp-discovery
spec:
  parentRefs:
    - name: {{ .Values.sigbot.api.gateway.name }}
      {{- with .Values.sigbot.api.gateway.namespace }}
      namespace: {{ . }}
      {{- end }}
  hostnames:
    {{- toYaml .Values.sigbot.api.gateway.hostnames | nindent 4 }}
  rules:
    - matches:
        - path: {type: PathPrefix, value: /.well-known/oauth-protected-resource}
        - path: {type: Exact, value: /.well-known/oauth-authorization-server}
      backendRefs:
        - name: {{ include "sigbot.fullname" . }}-server
          port: {{ .Values.sigbot.api.protocols.mcp.port }}
{{- end }}
{{- if .Values.sigbot.api.protocols.a2a.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "sigbot.fullname" . }}-a2a-discovery
spec:
  parentRefs:
    - name: {{ .Values.sigbot.api.gateway.name }}
      {{- with .Values.sigbot.api.gateway.namespace }}
      namespace: {{ . }}
      {{- end }}
  hostnames:
    {{- toYaml .Values.sigbot.api.gateway.hostnames | nindent 4 }}
  rules:
    - matches:
        - path: {type: Exact, value: /.well-known/agent-card.json}
      backendRefs:
        - name: {{ include "sigbot.fullname" . }}-server
          port: {{ .Values.sigbot.api.protocols.a2a.port }}
{{- end }}
{{- end }}
