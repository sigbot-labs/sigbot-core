{{- if and .Values.sigbot.controller.enabled .Values.sigbot.controller.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sigbot.serviceAccountName" . }}
  labels: {{ include "sigbot.labels" . | nindent 4 }}
  {{- with .Values.sigbot.controller.serviceAccount.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "sigbot.fullname" . }}-controller
  labels: {{ include "sigbot.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "sigbot.fullname" . }}-controller
  labels: {{ include "sigbot.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ include "sigbot.fullname" . }}-controller}
subjects:
  - {kind: ServiceAccount, name: {{ include "sigbot.serviceAccountName" . }}, namespace: {{ .Release.Namespace }}}
{{- end }}
