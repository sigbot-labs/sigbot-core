{{- if .Values.sigbot.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sigbot.fullname" . }}-server
  labels:
    {{- include "sigbot.labels" . | nindent 4 }}
    sigbot.io/component: api
spec:
  replicas: {{ .Values.sigbot.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "sigbot.selectorLabels" . | nindent 6 }}
      sigbot.io/component: api
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/platform/configmap.yaml") . | sha256sum }}
        secrets/revision: {{ .Values.secrets.revision | quote }}
      labels:
        {{- include "sigbot.selectorLabels" . | nindent 8 }}
        sigbot.io/component: api
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000}
      initContainers:
        {{- include "sigbot.migrationInitContainer" (dict "root" . "image" .Values.sigbot.image) | nindent 8 }}
      containers:
        - name: api
          image: {{ include "sigbot.image" (dict "root" . "image" .Values.sigbot.image) | quote }}
          imagePullPolicy: {{ .Values.sigbot.image.pullPolicy }}
          command: ["sigbot", "api", "--config", "/etc/sigbot/sigbot.yaml"]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          ports:
            - {name: http, containerPort: 9000}
            - {name: management, containerPort: 9001}
          env:
            {{- include "sigbot.configEnvironment" . | nindent 12 }}
            - {name: SIGBOT__MGMT__HOST, value: 0.0.0.0}
            - {name: SIGBOT__MGMT__PORT, value: "9001"}
            {{- include "sigbot.tenantMiddlewareEnvironment" . | nindent 12 }}
            {{- include "sigbot.secretEnvironment" . | nindent 12 }}
          resources:
            {{- toYaml .Values.sigbot.api.resources | nindent 12 }}
          readinessProbe: {httpGet: {path: /_/healthz, port: management}}
          livenessProbe: {httpGet: {path: /_/livez, port: management}}
          volumeMounts:
            - {name: config, mountPath: /etc/sigbot/sigbot.yaml, subPath: sigbot.yaml, readOnly: true}
            - {name: storage, mountPath: /var/lib/sigbot/storage}
        {{- range $protocol, $settings := .Values.sigbot.api.protocols }}
        {{- if and $settings.enabled (eq $protocol "a2a") }}
        - name: {{ $protocol }}
          image: {{ include "sigbot.image" (dict "root" $ "image" $.Values.sigbot.image) | quote }}
          imagePullPolicy: {{ $.Values.sigbot.image.pullPolicy }}
          command: ["sigbot", {{ $protocol | quote }}, "--config", "/etc/sigbot/sigbot.yaml"]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          ports:
            - {name: {{ $protocol }}, containerPort: {{ $settings.port }}}
          env:
            {{- include "sigbot.configEnvironment" $ | nindent 12 }}
            - {name: SIGBOT__MGMT__HOST, value: "0.0.0.0"}
            - {name: SIGBOT__MGMT__PORT, value: "19093"}
            - {name: {{ printf "SIGBOT__SERVICES__PLATFORM__API__%s__ENABLED" (upper $protocol) }}, value: "true"}
            - {name: {{ printf "SIGBOT__SERVICES__PLATFORM__API__%s__BIND_ADDRESS" (upper $protocol) }}, value: {{ printf "0.0.0.0:%v" $settings.port | quote }}}
            {{- $publicUrl := default "" $settings.publicUrl }}
            {{- if and (not $publicUrl) $.Values.sigbot.api.gateway.enabled $.Values.sigbot.api.gateway.hostnames }}
            {{- $publicUrl = printf "https://%s/%s" (first $.Values.sigbot.api.gateway.hostnames) $protocol }}
            {{- end }}
            {{- if $publicUrl }}
            - {name: {{ printf "SIGBOT__SERVICES__PLATFORM__API__%s__PUBLIC_URL" (upper $protocol) }}, value: {{ $publicUrl | quote }}}
            {{- end }}
            {{- include "sigbot.tenantMiddlewareEnvironment" $ | nindent 12 }}
            {{- include "sigbot.secretEnvironment" $ | nindent 12 }}
          resources:
            {{- toYaml $.Values.sigbot.api.resources | nindent 12 }}
          readinessProbe: {httpGet: {path: /_/healthz, port: 19093}}
          livenessProbe: {httpGet: {path: /_/livez, port: 19093}}
          volumeMounts:
            - {name: config, mountPath: /etc/sigbot/sigbot.yaml, subPath: sigbot.yaml, readOnly: true}
            - {name: storage, mountPath: /var/lib/sigbot/storage}
        {{- end }}
        {{- end }}
      volumes:
        - name: config
          configMap: {name: {{ include "sigbot.fullname" . }}-config}
        - name: storage
          {{- if .Values.sigbot.api.persistence.storageClass }}
          persistentVolumeClaim: {claimName: {{ include "sigbot.fullname" . }}-storage}
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
