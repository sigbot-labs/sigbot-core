{{- if .Values.sigbot.api.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sigbot.fullname" . }}-server
  labels:
    {{- include "sigbot.labels" . | nindent 4 }}
    sigbot.io/component: api
    sigbot.io/metrics: "true"
spec:
  type: {{ .Values.sigbot.api.service.type }}
  ports:
    - {name: http, port: {{ .Values.sigbot.api.service.port }}, targetPort: http, protocol: TCP}
    - {name: management, port: 9001, targetPort: management, protocol: TCP}
    {{- if .Values.sigbot.api.protocols.mcp.enabled }}
    - {name: mcp, port: {{ .Values.sigbot.api.protocols.mcp.port }}, targetPort: mcp, protocol: TCP}
    {{- end }}
    {{- if .Values.sigbot.api.protocols.a2a.enabled }}
    - {name: a2a, port: {{ .Values.sigbot.api.protocols.a2a.port }}, targetPort: a2a, protocol: TCP}
    {{- end }}
  selector:
    {{- include "sigbot.selectorLabels" . | nindent 4 }}
    sigbot.io/component: api
{{- end }}
